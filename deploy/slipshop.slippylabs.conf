# SlipShop is ARCHIVED (2026-10-11). PhotoCraft, an open-source ArtCraft image
# editor installed by the craftsuite repo, replaced it on art.slippylabs.com
# and in SlipStudio's 2D tab. This block only keeps old links working; the
# docroot was moved to ~/archive/slipshop-www-2026-10-11.tar.gz. The vhost
# that served the app is in this file's git history (v1.1.3).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name slipshop.slippylabs.com;
    include snippets/security-headers.conf;

    ssl_certificate     /etc/letsencrypt/live/slippylabs-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slippylabs-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 301 https://photocraft.slippylabs.com/;
    }
}
